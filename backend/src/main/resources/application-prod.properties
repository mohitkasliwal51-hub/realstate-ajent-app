# =============================================================================
# StayFile Backend - Production Profile Configuration (prod)
# Strict security: No default fallbacks allowed for secrets or passwords
# =============================================================================

# Database Configuration (Must be provided via Environment Variables)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JWT & PII Security Configuration (Must be provided via Environment Variables)
stayfile.jwt.secret=${JWT_SECRET}
stayfile.jwt.expiration=${JWT_EXPIRATION:86400000}
stayfile.pii.secret-key=${PII_SECRET_KEY}

# Logging Level for Production
logging.level.root=WARN
logging.level.com.bhartiyasaas.stayfile=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=INFO
