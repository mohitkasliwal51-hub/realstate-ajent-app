# =============================================================================
# StayFile Backend - Production Profile Configuration (prod)
# Strict security: No default fallbacks allowed for secrets or passwords
# =============================================================================

# Database Configuration (Must be provided via Environment Variables)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JWT & PII Security Configuration (Must be provided via Environment Variables)
stayfile.jwt.secret=${JWT_SECRET}
stayfile.jwt.expiration=${JWT_EXPIRATION:86400000}
stayfile.pii.secret-key=${PII_SECRET_KEY}

# JPA / Hibernate Configuration for Production (Disable SQL logging to prevent PII leaks)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging Level for Production
logging.level.root=WARN
logging.level.com.bhartiyasaas.stayfile=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=INFO

# Cloud Storage Configuration for Production
app.storage.provider=${STORAGE_PROVIDER:supabase}
app.storage.supabase.url=${SUPABASE_URL:}
app.storage.supabase.key=${SUPABASE_SERVICE_ROLE_KEY:}
app.storage.supabase.bucket=${SUPABASE_BUCKET:stayfile_prod}

# Third-Party APIs in Production: Uses Live Production Endpoints
stayfile.verification.cashfree.client-id=${CASHFREE_CLIENT_ID:}
stayfile.verification.cashfree.client-secret=${CASHFREE_CLIENT_SECRET:}
stayfile.verification.cashfree.base-url=https://api.cashfree.com/verification
stayfile.payment.cashfree.env=production

stayfile.kyc.surepass.base-url=https://kyc.surepass.io
stayfile.kyc.surepass.token=${SUREPASS_TOKEN:}

