# =============================================================================
# StayFile Backend - Common Application Properties
# BhartiyaSaaS Software Labs - Real Estate Broker & PG Management Platform API
# =============================================================================

# Active Spring Profile (Defaults to dev profile)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# Application Name
spring.application.name=StayFile

# PostgreSQL Driver Configuration
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.generate-ddl=false

# Jackson JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.deserialization.adjust-dates-to-context-time-zone=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC

# Surepass Configuration (e-Stamping & Background/Police Verification)
stayfile.kyc.surepass.base-url=${SUREPASS_BASE_URL:https://sandbox.surepass.io}
stayfile.kyc.surepass.token=${SUREPASS_TOKEN:}


# Dynamic CORS Configuration
stayfile.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Actuator / Health Check Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always

# Storage Configuration
app.storage.provider=${STORAGE_PROVIDER:local}
app.storage.local-dir=${STORAGE_LOCAL_DIR:./uploads}
app.storage.max-file-size-bytes=${MAX_FILE_SIZE_BYTES:10485760}
app.storage.supabase.url=${SUPABASE_URL:}
app.storage.supabase.key=${SUPABASE_SERVICE_ROLE_KEY:}
app.storage.supabase.bucket=${SUPABASE_BUCKET:stayfile}

# Spring Multipart Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Payment Gateway Configuration (Cashfree)
stayfile.payment.cashfree.client-id=${CASHFREE_CLIENT_ID:}
stayfile.payment.cashfree.client-secret=${CASHFREE_CLIENT_SECRET:}
stayfile.payment.cashfree.env=${CASHFREE_ENV:sandbox}

# WhatsApp Business API Configuration (Meta Cloud API)
stayfile.whatsapp.meta.phone-number-id=${WHATSAPP_META_PHONE_NUMBER_ID:}
stayfile.whatsapp.meta.access-token=${WHATSAPP_META_ACCESS_TOKEN:}
stayfile.whatsapp.meta.catalog-id=${WHATSAPP_META_CATALOG_ID:}

# External API RestClient Timeout Configuration
stayfile.http.client.connect-timeout-ms=${HTTP_CONNECT_TIMEOUT_MS:10000}
stayfile.http.client.read-timeout-ms=${HTTP_READ_TIMEOUT_MS:30000}

# Cashfree Secure ID (Identity, KYB & Bank Verification)
stayfile.verification.cashfree.client-id=${CASHFREE_VERIFICATION_CLIENT_ID:${CASHFREE_CLIENT_ID:CF11320867DBUM2CR4JA1S739VAFRG}}
stayfile.verification.cashfree.client-secret=${CASHFREE_VERIFICATION_CLIENT_SECRET:${CASHFREE_CLIENT_SECRET:cfsk_ma_test_0106b108677bc86b8e6685f873eb2102_9d9e6560}}
stayfile.verification.cashfree.base-url=${CASHFREE_VERIFICATION_BASE_URL:https://sandbox.cashfree.com/verification}
stayfile.verification.cashfree.api-version=${CASHFREE_API_VERSION:2024-01-01}



