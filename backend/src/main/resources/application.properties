# =============================================================================
# StayFile Backend - Common Application Properties
# BhartiyaSaaS Software Labs - Real Estate Broker & PG Management Platform API
# =============================================================================

# Active Spring Profile (Defaults to dev profile)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# Application Name
spring.application.name=StayFile

# PostgreSQL Driver Configuration
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.generate-ddl=false

# Jackson JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.deserialization.adjust-dates-to-context-time-zone=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC

# KYC Provider Placeholders
stayfile.kyc.provider=${KYC_PROVIDER:TODO}
stayfile.kyc.surepass.base-url=${SUREPASS_BASE_URL:}
stayfile.kyc.surepass.token=${SUREPASS_TOKEN:}
stayfile.kyc.digio.base-url=${DIGIO_BASE_URL:}
stayfile.kyc.digio.client-id=${DIGIO_CLIENT_ID:}
stayfile.kyc.digio.client-secret=${DIGIO_CLIENT_SECRET:}

# E-stamp and Aadhaar OTP e-sign Provider Placeholders
stayfile.esign.provider=${ESIGN_PROVIDER:TODO}
stayfile.esign.base-url=${ESIGN_BASE_URL:}
stayfile.esign.api-key=${ESIGN_API_KEY:}

# Dynamic CORS Configuration
stayfile.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Actuator / Health Check Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always

# Storage Configuration
app.storage.provider=${STORAGE_PROVIDER:local}
app.storage.local-dir=${STORAGE_LOCAL_DIR:./uploads}
app.storage.max-file-size-bytes=${MAX_FILE_SIZE_BYTES:10485760}
app.storage.supabase.url=${SUPABASE_URL:}
app.storage.supabase.key=${SUPABASE_SERVICE_ROLE_KEY:}

# Spring Multipart Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Payment Gateway Configuration (Cashfree)
stayfile.payment.cashfree.client-id=${CASHFREE_CLIENT_ID:}
stayfile.payment.cashfree.client-secret=${CASHFREE_CLIENT_SECRET:}
stayfile.payment.cashfree.env=${CASHFREE_ENV:sandbox}

# WhatsApp Business API Configuration (Meta Cloud API)
stayfile.whatsapp.meta.phone-number-id=${WHATSAPP_META_PHONE_NUMBER_ID:}
stayfile.whatsapp.meta.access-token=${WHATSAPP_META_ACCESS_TOKEN:}
stayfile.whatsapp.meta.catalog-id=${WHATSAPP_META_CATALOG_ID:}

