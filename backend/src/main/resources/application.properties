# =============================================================================
# StayFile Backend - Spring Boot Application Properties
# BhartiyaSaaS Software Labs - Real Estate Broker & PG Management Platform API
# =============================================================================

# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# Application Name
spring.application.name=StayFile

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:stayfile}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.generate-ddl=false

# Jackson JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.deserialization.adjust-dates-to-context-time-zone=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC

# JWT Security Configuration
stayfile.jwt.secret=${JWT_SECRET:fMoarndXgVPB6VwaPCF2NtUyOxjIsdn9QjruuUlHE9w=}
stayfile.jwt.expiration=${JWT_EXPIRATION:86400000}
stayfile.pii.secret-key=${PII_SECRET_KEY:W5Bj3tcF+9DatuwfVnRwMF/U1IRKCMIfYnXMllemO1Q=}

# KYC provider placeholders. Configure one provider before enabling live verification.
stayfile.kyc.provider=${KYC_PROVIDER:TODO}
stayfile.kyc.surepass.base-url=${SUREPASS_BASE_URL:}
stayfile.kyc.surepass.token=${SUREPASS_TOKEN:}
stayfile.kyc.digio.base-url=${DIGIO_BASE_URL:}
stayfile.kyc.digio.client-id=${DIGIO_CLIENT_ID:}
stayfile.kyc.digio.client-secret=${DIGIO_CLIENT_SECRET:}

# E-stamp and Aadhaar OTP e-sign provider placeholders.
stayfile.esign.provider=${ESIGN_PROVIDER:TODO}
stayfile.esign.base-url=${ESIGN_BASE_URL:}
stayfile.esign.api-key=${ESIGN_API_KEY:}

# Dynamic CORS Configuration
stayfile.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Logging Configuration
logging.level.root=INFO
logging.level.com.bhartiyasaas.stayfile=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=INFO

# Actuator / Health Check Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always
